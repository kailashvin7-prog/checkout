<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>
<style>
body{font-family:Arial;background:#f1f3f6;margin:0}
.box{max-width:500px;margin:20px auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 0 10px #ccc}
h2{color:#2874f0}
input,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:5px}
button{width:100%;padding:14px;background:#fb641b;color:#fff;border:none;border-radius:5px;font-size:18px;cursor:pointer}
.price{font-size:22px;color:green;font-weight:bold}
</style>
</head>
<body>

<div class="box">
<h2>Checkout</h2>

<h3>Bluetooth Earbuds</h3>
<p class="price">₹999</p>

<input type="text" placeholder="Full Name" required>
<input type="tel" placeholder="Mobile Number" required>
<textarea placeholder="Full Address"></textarea>
<input type="text" placeholder="PIN Code">

<button onclick="payNow()">Continue to Payment</button>

</div>

<script>
function payNow(){
window.location.href="https://rzp.io/";
}
</script>

</body>
</html>
