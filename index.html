<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>
<style>
body{font-family:Arial;background:#f1f3f6;margin:0}
.box{max-width:500px;margin:20px auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 0 10px #ccc}
h2{color:#2874f0}
input,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:5px}
button{width:100%;padding:14px;background:#fb641b;color:#fff;border:none;border-radius:5px;font-size:18px;cursor:pointer}
.price{font-size:22px;color:green;font-weight:bold}
</style>
</head>
<body>

<div class="box">
<h2>Checkout</h2>

<h3 id="productName">Product</h3>
<p class="price" id="productPrice">₹0</p>
<input type="text" placeholder="Full Name" required>
<input type="tel" placeholder="Mobile Number" required>
<textarea placeholder="Full Address"></textarea>
<input type="text" placeholder="PIN Code">

<button onclick="payNow()">Continue to Payment</button>

</div>

<script>
const params = new URLSearchParams(window.location.search);

const product = params.get("product") || "Bluetooth Earbuds";
const price = params.get("price") || "999";

document.getElementById("productName").innerText = product;
document.getElementById("productPrice").innerText = "₹" + price;

function payNow() {
    window.location.href = "upi://pay?pa=75687358@ybl&pn=Kailash&am=" + price + "&pn=Kailash&cu=INR";
}
</script>

</body>
</html>
